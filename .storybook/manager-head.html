<style>
    #storybook-explorer-tree .sidebar-item svg {
        color: #000091;
    }

    #storybook-explorer-tree .sidebar-item[data-selected='true'] svg {
        color: white;
    }

    /* Remove skip links and their spacing completely */
    a[href="#storybook-preview-wrapper"] {
        display: none !important;
        position: absolute !important;
        width: 0 !important;
        height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        line-height: 0 !important;
        font-size: 0 !important;
    }

    /*
     * Storybook 10 centre la preview via DEUX conteneurs en grille
     * (place-content/place-items: center) :
     *   - #storybook-preview-wrapper (IframeWrapper, id stable) ;
     *   - « CanvasWrap » : un styled.div SANS id, seulement une classe emotion hashée
     *     (ex. css-14qbhoz) qui change à chaque build → impossible à cibler par classe.
     * Ce centrage affiche le contenu au milieu avec une scrollbar (surtout Firefox).
     * On annule le centrage sur tout <div> contenant l'iframe de preview (via :has,
     * supporté par Firefox 121+/Chrome/Safari), indépendamment de la classe hashée.
     */
    #storybook-preview-wrapper,
    div:has(#storybook-preview-iframe) {
        place-content: stretch !important;
        place-items: stretch !important;
    }

    /* Firefox donne 150px de hauteur par défaut à une iframe sans hauteur explicite :
       on la force à remplir son conteneur. */
    #storybook-preview-iframe {
        width: 100% !important;
        height: 100% !important;
    }

    .sidebar-header img {
        display: block !important;
        width: auto;
        height: 50px;
    }

    .search-field {
        box-shadow: rgb(205 205 205) 0px 0px 0px 1px inset !important;
    }
</style>
