<style>
    #storybook-explorer-tree .sidebar-item svg {
        color: #000091;
    }

    #storybook-explorer-tree .sidebar-item[data-selected='true'] svg {
        color: white;
    }

    /* Remove skip links and their spacing completely */
    a[href="#storybook-preview-wrapper"] {
        display: none !important;
        position: absolute !important;
        width: 0 !important;
        height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        line-height: 0 !important;
        font-size: 0 !important;
    }

    /*
     * Storybook 10 : le conteneur de l'iframe (#storybook-preview-wrapper) est une
     * grille en place-content/place-items: center. Ce centrage décale le contenu
     * vers le milieu et provoque une scrollbar (visible notamment sur Firefox).
     * On force le remplissage sans centrage : l'iframe occupe tout l'espace, alignée
     * en haut à gauche.
     */
    #storybook-preview-wrapper {
        place-content: stretch !important;
        place-items: stretch !important;
    }

    /* Firefox donne 150px de hauteur par défaut à une iframe sans hauteur explicite ;
       combiné au centrage du wrapper, cela affichait le contenu au milieu avec une
       scrollbar. On force l'iframe à remplir son conteneur. */
    #storybook-preview-wrapper > iframe {
        width: 100% !important;
        height: 100% !important;
        align-self: stretch !important;
        justify-self: stretch !important;
    }

    .sidebar-header img {
        display: block !important;
        width: auto;
        height: 50px;
    }

    .search-field {
        box-shadow: rgb(205 205 205) 0px 0px 0px 1px inset !important;
    }
</style>
