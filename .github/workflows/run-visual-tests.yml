name: Visual Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/components/**'
      - 'cypress/**'
      - 'src/assets/**'
      - '.github/workflows/**'

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      TZ: "Europe/Paris"
      CI: true

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Accept Microsoft core fonts EULA
        run: echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
      - name: Install Arial font
        run: sudo apt-get update && sudo apt-get install -y ttf-mscorefonts-installer
      - name: Verify Arial font
        run: fc-match --format='%{family}\n' Arial | grep -Fx 'Arial'
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-
      - name: Install Cypress binary
        run: pnpm cypress install
      - name: Run visual regression tests
        run: pnpm test:visual
      - name: Upload visual test diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-visual-diffs
          path: cypress/snapshots/diff
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload visual test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-visual-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7
