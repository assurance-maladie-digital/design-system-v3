name: Update Accessibility Status Report

on:
  push:
    branches:
      - '**'
  workflow_dispatch:  # Permet le déclenchement manuel

jobs:
  update-a11y-status:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[update a11y report]')
    
    steps:
      - name: Debug - Print commit message
        run: |
          echo "Commit message: ${{ github.event.head_commit.message }}"
          echo "Contains flag: ${{ contains(github.event.head_commit.message, '[update a11y report]') }}"
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
          
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
          
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
        
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Generate A11y Status Report
        run: pnpm a11y:status
        
      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add a11y-status-report.md src/stories/Accessibilite/DesignSystem/a11y-status.json
          # Always commit to ensure the report reflects the latest state
          git commit -m "chore(a11y): auto-update accessibility status report [skip ci]" || echo "No changes to commit"
          git push
