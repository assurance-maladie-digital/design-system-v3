name: Update Accessibility Status Report

on:
  push:
    branches:
      - '**'
  workflow_dispatch:  # Permet le déclenchement manuel

jobs:
  update-a11y-status:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[update a11y report]')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install pnpm
        run: npm install -g pnpm
        
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Generate A11y Status Report
        run: pnpm a11y:status
        
      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add a11y-status-report.md src/stories/Accessibilite/DesignSystem/a11y-status.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(a11y): auto-update accessibility status report [skip ci]" && git push)
