name: Update Visual Test Snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update snapshots on (leave empty for current branch)"
        required: false
        type: string
      spec:
        description: "Spec glob pattern (e.g. 'src/components/ChipList/**/*.visual.cy.ts'). Leave empty to update all."
        required: false
        type: string
  push:
    tags:
      - 'update-snapshots'
      - 'update-snapshots-*'

permissions:
  contents: write

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.split.outputs.specs }}
      single-spec: ${{ steps.split.outputs.single-spec }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.head_ref || github.ref }}
      - name: Split specs into 4 groups
        id: split
        shell: bash
        run: |
          SPEC_INPUT="${{ github.event.inputs.spec }}"
          if [ -n "$SPEC_INPUT" ]; then
            echo "single-spec=$SPEC_INPUT" >> $GITHUB_OUTPUT
            echo "specs=[]" >> $GITHUB_OUTPUT
          else
            mapfile -t SPECS_ARRAY < <(find src -name "*.visual.cy.ts" | sort)
            TOTAL=${#SPECS_ARRAY[@]}
            CHUNK=$(( (TOTAL + 3) / 4 ))
            GROUPS=()
            for i in 0 1 2 3; do
              START=$((i * CHUNK))
              SLICE=("${SPECS_ARRAY[@]:$START:$CHUNK}")
              if [ ${#SLICE[@]} -gt 0 ]; then
                JOINED=$(IFS=,; echo "${SLICE[*]}")
                GROUPS+=("\"$JOINED\"")
              fi
            done
            JSON="[$(IFS=,; echo "${GROUPS[*]}")]"
            echo "specs=$JSON" >> $GITHUB_OUTPUT
            echo "single-spec=" >> $GITHUB_OUTPUT
          fi

  run-specs:
    needs: generate-matrix
    if: needs.generate-matrix.outputs.single-spec == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        specs: ${{ fromJson(needs.generate-matrix.outputs.specs) }}
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      TZ: "Europe/Paris"
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-arial-fonts
      - name: Install Arial font
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y --no-upgrade ttf-mscorefonts-installer 2>/dev/null || true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Cypress binary
        run: pnpm cypress install --force
      - name: Run specs
        run: pnpm cypress run --component --browser electron --env updateSnapshots=true --spec "${{ matrix.specs }}"
      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ strategy.job-index }}
          path: src/**/__snapshots__
          retention-days: 1

  run-single-spec:
    needs: generate-matrix
    if: needs.generate-matrix.outputs.single-spec != ''
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      TZ: "Europe/Paris"
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-arial-fonts
      - name: Install Arial font
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y --no-upgrade ttf-mscorefonts-installer 2>/dev/null || true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Cypress binary
        run: pnpm cypress install --force
      - name: Run spec
        run: pnpm cypress run --component --browser electron --env updateSnapshots=true --spec "${{ needs.generate-matrix.outputs.single-spec }}"
      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-single
          path: src/**/__snapshots__
          retention-days: 1

  commit-snapshots:
    needs: [run-specs, run-single-spec]
    if: always() && (needs.run-specs.result == 'success' || needs.run-single-spec.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: snapshots-*
          merge-multiple: true
      - name: Check for changes
        id: verify
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Commit and push updated snapshots
        if: steps.verify.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update visual snapshots"
          git push
      - name: Upload updated snapshots as artifact
        if: steps.verify.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updated-snapshots
          path: src/**/__snapshots__
          retention-days: 30
