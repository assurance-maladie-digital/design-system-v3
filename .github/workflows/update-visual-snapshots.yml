name: Update Visual Test Snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update snapshots on (leave empty for current branch)"
        required: false
        type: string
      spec:
        description: "Spec filter (e.g. 'ChipList' or 'Accordion,ChipList'). Leave empty to update all."
        required: false
        type: string
  push:
    tags:
      - 'update-snapshots'
      - 'update-snapshots-*'

permissions:
  contents: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      TZ: "Europe/Paris"
      CI: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Accept Microsoft core fonts EULA
        run: echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
      - name: Install Arial font
        run: sudo apt-get update && sudo apt-get install -y ttf-mscorefonts-installer
      - name: Verify Arial font
        run: fc-match --format='%{family}\n' Arial | grep -Fx 'Arial'
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-
      - name: Install Cypress binary
        run: pnpm cypress install
      - name: Update visual test snapshots
        run: |
          if [ -n "${{ github.event.inputs.spec }}" ]; then
            SPECS=$(echo "${{ github.event.inputs.spec }}" | tr ',' '\n' | sed 's|.*|src/components/**/*&*.visual.cy.ts|' | tr '\n' ',')
            pnpm cypress run --component --browser electron --env updateSnapshots=true --spec "$SPECS"
          else
            pnpm test:visual:update
          fi
      - name: Check for changes
        id: verify
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Commit and push updated snapshots 
        if: steps.verify.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update visual snapshots"
          git push
      - name: Upload updated snapshots as artifact
        if: steps.verify.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updated-snapshots
          path: src/**/__snapshots__
          retention-days: 30