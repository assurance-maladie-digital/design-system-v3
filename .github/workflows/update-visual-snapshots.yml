name: Update Visual Test Snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update snapshots on (leave empty for current branch)"
        required: false
        type: string
  pull_request:
    paths:
      - 'src/components/**'
      - 'cypress/**'
      - '.github/workflows/**'
  push:
    tags:
      - 'update-snapshots'
      - 'update-snapshots-*'

permissions:
  contents: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      TZ: "Europe/Paris"
      CI: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install pnpm
        run: npm install -g pnpm@8
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Update visual test snapshots
        run: pnpm test:visual:update
      - name: Check for changes
        id: verify
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Commit and push updated snapshots
        if: steps.verify.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update visual snapshots"
          git push
      - name: Upload updated snapshots as artifact
        if: steps.verify.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updated-snapshots
          path: src/**/__snapshots__
          retention-days: 30
