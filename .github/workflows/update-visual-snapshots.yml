name: Update Visual Test Snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update snapshots on (leave empty for current branch)"
        required: false
        type: string
  pull_request:
    paths:
      - 'src/components/**'
      - 'cypress/**'
      - '.github/workflows/**'
  push:
    branches:
      - 'feat/visual-snapshots'

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      TZ: "Europe/Paris"
      CI: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install pnpm
        run: npm install -g pnpm@8
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Update visual test snapshots
        run: pnpm test:visual:update
      - name: Check for changes
        id: verify
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Create Pull Request
        if: steps.verify.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: update visual snapshots"
          title: "chore: update visual snapshots"
          body: |
            Updated visual regression test snapshots from CI.
            
            **This PR was auto-generated by the Update Visual Test Snapshots workflow.**
            
            Review the changes carefully before merging.
          branch: feat/visual-snapshots
          delete-branch: true
      - name: Upload updated snapshots as artifact
        if: steps.verify.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updated-snapshots
          path: src/**/__snapshots__
          retention-days: 30
